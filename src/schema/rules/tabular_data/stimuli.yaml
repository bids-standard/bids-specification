---
# Selectors for the catalog tables are path-based rather than suffix-based:
# stimuli.tsv and annotations.tsv match stem file rules, and the validator
# clears context.suffix for stem-matched files (cleanContext), so a
# suffix == "stimuli" selector would never fire.
Stimuli:
  selectors:
    - extension == ".tsv"
    - match(path, '^/stimuli/stimuli\.tsv$')
  initial_columns:
    - stimulus_id
    - type__stimuli
  columns:
    stimulus_id: required
    type__stimuli: recommended
    URL: optional
    license: recommended
    copyright: recommended
    description__stimuli: recommended
    HED: optional
    filename: optional
    present: optional
    partDescription__stimuli: optional
  additional_columns: allowed_if_defined

# Scoped stimuli.tsv files in subdirectories amend or override the root
# catalog (Inheritance Principle), so only the stimulus_id key is required.
StimuliScoped:
  selectors:
    - extension == ".tsv"
    - match(path, '^/stimuli/.+/stimuli\.tsv$')
  initial_columns:
    - stimulus_id
  columns:
    stimulus_id: required
    type__stimuli: optional
    URL: optional
    license: optional
    copyright: optional
    description__stimuli: optional
    HED: optional
    filename: optional
    present: optional
    partDescription__stimuli: optional
  additional_columns: allowed_if_defined

Annotations:
  selectors:
    - extension == ".tsv"
    - match(path, '^/stimuli/(.+/)?(stim-[0-9a-zA-Z+]+_)?annotations\.tsv$')
  initial_columns:
    - annot_id
    - description__annot
  columns:
    annot_id: required
    description__annot: required
  additional_columns: allowed_if_defined

StimulusEvents:
  selectors:
    - suffix == "events"
    - entities.stimulus != null
  initial_columns:
    - onset
    - duration
  columns:
    onset: required
    duration: recommended
  additional_columns: allowed_if_defined
