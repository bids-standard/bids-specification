# Rules for phenotype files
---
# 51
PhenotypeSubjectsMissing:
  issue:
    code: PHENOTYPE_SUBJECTS_MISSING
    message: |
      A phenotype/ .tsv file lists subjects that were not found in
      the participant_id column found in the participants.tsv file.
    level: error
  selectors:
    - datatype == 'phenotype'
    - extension == '.tsv'
    - type(dataset.subjects.participant_id) != 'null'
  checks:
    # A∩B == A iff A⊆B
    - |
      length(intersects(unique(columns.participant_id), dataset.subjects.participant_id))
      == length(unique(columns.participant_id))

PhenotypeDemographicsFileRequiredByTool:
  issue:
    code: PHENOTYPE_DEMOGRAPHICS_FILE_REQUIRED
    message: |
      A phenotype TSV file contains a session_id column but no
      /phenotype/tool-Demographics_phenotype.tsv file
      was found in the /phenotype/ directory.
    level: error
  selectors:
    - datatype == 'phenotype'
    - suffix == 'phenotype'
    - extension == '.tsv'
    - intersects(dataset.dataset_description.AdditionalValidation, ["Phenotype"])
    - type(columns.session_id) != 'null'
  checks:
    - exists('phenotype/tool-Demographics_phenotype.tsv', 'dataset')

PhenotypeDemographicsFileRequiredBySessionDir:
  issue:
    code: PHENOTYPE_DEMOGRAPHICS_FILE_REQUIRED
    message: |
      A phenotype/tool-Demographics_phenotype.tsv file is required when session
      directories are present and additional phenotype validation is enabled.
    level: error
  selectors:
    - path == '/dataset_description.json'
    - intersects(dataset.dataset_description.AdditionalValidation, ["Phenotype"])
    - length(glob("sub-*/ses-*")) > 0
  checks:
    - exists('phenotype/tool-Demographics_phenotype.tsv', 'dataset')

PhenotypeSessionLevels:
  issue:
    code: PHENOTYPE_SESSION_LEVELS
    message: |
      phenotype/tool-Demographics_phenotype.tsv missing `Levels` definition for `session_id` object in
      its sidecar.
    level: error
  selectors:
    - suffix == 'phenotype'
    - extension == '.tsv'
    - intersects(dataset.dataset_description.AdditionalValidation, ["Phenotype"])
    - type(sidecar.session_id) != 'null'
  checks:
    - type(sidecar.session_id.Levels) != 'null'

PhenotypeSessionDirectoryMissing:
  issue:
    code: SESSION_REQUIRED
    message: |
      No subject session directories were found. Use of session_id columns in
      phenotype tsv files requires that session directories be used for any subject
      directories.
    level: error
  selectors:
    - intersects(dataset.dataset_description.AdditionalValidation, ["Phenotype"])
    - entities.tool == 'Demographics'
    - suffix == 'phenotype'
    - extension == '.tsv'
    - type(columns.session_id) != 'null'
    - length(glob("sub-*")) > 0
  checks:
    - length(glob("sub-*/ses-*")) > 0

PhenotypeSessionRequired:
  issue:
    code: SESSION_REQUIRED
    message: |
      Every data file MUST be found in a session directory when
      multi-session data is detected in the dataset and
      "Phenotype" additional validation has been enabled.
    level: error
  selectors:
    - type(entities.sub) != 'null'
    - "!intersects([extension], ['.tsv', '.json'])"
    - length(glob("sub-*/ses-*")) > 0
    - intersects(dataset.dataset_description.AdditionalValidation, ["Phenotype"])
  checks:
    - type(entities.ses) != 'null'

PhenotypeIndexColumnsRequired:
  issue:
    code: PHENOTYPE_TOOL_MISSING_INDEX_COLUMNS
    message: |
      A phenotype file is missing the `IndexColumns` key and value in its associated sidecar.
    level: error
  selectors:
    - suffix == 'phenotype'
    - extension == '.tsv'
    - intersects(dataset.dataset_description.AdditionalValidation, ["Phenotype"])
    - type(columns.session_id) != 'null'
  checks:
    - type(sidecar.IndexColumns) != 'null'

    
PhenotypeSessionColumn:
  issue:
    code: PHENOTYPE_SESSION_LEVELS
    message: |
      phenotype/tool-Demographics_phenotype.tsv missing `Levels` definition for `session_id` object in
      its sidecar.
    level: error
  selectors:
    - suffix == 'phenotype'
    - extension == '.tsv'
    - intersects(dataset.dataset_description.AdditionalValidation, ["Phenotype"])
    - length(glob("sub-*/ses-*")) > 0
  checks:
    - type(sidecar.session_id) != 'null'
