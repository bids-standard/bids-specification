---
# For microephys, only space-labeled electrodes.tsv requires coordsystem.json
# Non-microephys modalities are handled by RequiredCoordsystem in channels.yaml
MicroephysRequiredCoordsystemWithSpace:
  issue:
    code: MICROEPHYS_COORDSYSTEM_REQUIRED
    message: |
      For microelectrode electrophysiology data, if an electrodes.tsv file has a
      space-<label> entity, a corresponding coordsystem.json file with the same
      space label must also be present.
    level: error
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "electrodes"
    - extension == ".tsv"
    - '"space" in entities'
  checks:
    - associations.coordsystem != null

# The localization method belongs either in the electrodes table, where it can vary
# between electrodes, or in the sidecar, where it applies to all of them, but not in both.
MicroephysLocalizationMethodDuplicated:
  issue:
    code: MICROEPHYS_LOCALIZATION_METHOD_DUPLICATED
    message: |
      The localization method is given both in the `localization_method` column of
      `*_electrodes.tsv` and in the `LocalizationMethod` field of the corresponding
      `*_electrodes.json` file. It MUST be given in only one of the two.
    level: error
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "electrodes"
    - extension == ".tsv"
    - type(columns.localization_method) != "null"
  checks:
    - '!("LocalizationMethod" in sidecar)'

# Anatomical location terms are interpretable if the sidecar documents where they came
# from, either by resolving the terms themselves or by naming the atlas they were taken from.
MicroephysUndocumentedAnatomicalLocation:
  issue:
    code: MICROEPHYS_ANATOMICAL_LOCATION_UNDOCUMENTED
    message: |
      The `*_electrodes.tsv` file gives anatomical locations, but the corresponding
      `*_electrodes.json` file neither documents the terms with `TermURL` or `Levels`
      nor names the atlas they were taken from in `ReferenceAtlas`,
      so the terms cannot be interpreted.
    level: warning
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "electrodes"
    - extension == ".tsv"
    - columns.anatomical_location != null
  checks:
    - |
      sidecar.anatomical_location.TermURL != null ||
      sidecar.anatomical_location.Levels != null ||
      sidecar.ReferenceAtlas != null

# Stereotaxic coordinates cannot be interpreted without knowing the point they are
# measured from, so requiring the reference point is conditioned on their presence.
MicroephysRequiredAnatomicalReferencePoint:
  issue:
    code: MICROEPHYS_ANATOMICAL_REFERENCE_POINT_REQUIRED
    message: |
      The `anatomical_reference_point` column MUST be defined in `*_probes.tsv` when
      stereotaxic coordinates are given, that is, when any of the `AP`, `ML`, or `DV`
      columns are present.
    level: error
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "probes"
    - extension == ".tsv"
    - columns.AP != null || columns.ML != null || columns.DV != null
  checks:
    - columns.anatomical_reference_point != null

# Cross-file consistency checks for the channels -> electrodes -> probes hierarchy.
# Direction: child -> parent only (references must resolve).
# We do not check parent -> child (completeness) because not all electrodes
# need channels (broken contacts, reference-only) and not all probes need
# electrodes (subset recordings, run-specific channel selections).

MicroephysElectrodeProbeReference:
  issue:
    code: MICROEPHYS_ELECTRODE_PROBE_MISMATCH
    message: |
      Every `probe_name` value in `*_electrodes.tsv`, other than `n/a`, MUST match
      a `probe_name` entry in the corresponding `*_probes.tsv` file.
    level: error
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "electrodes"
    - extension == ".tsv"
    - associations.probes.probe_name != null
    - columns.probe_name != null
  checks:
    - |
      length(intersects(unique(columns.probe_name), associations.probes.probe_name))
      + count(unique(columns.probe_name), "n/a")
      >= length(unique(columns.probe_name))

MicroephysChannelElectrodeReference:
  issue:
    code: MICROEPHYS_CHANNEL_ELECTRODE_MISMATCH
    message: |
      Every `electrode_name` value in `*_channels.tsv`, other than `n/a`, MUST match
      a `name` entry in the corresponding `*_electrodes.tsv` file.
    level: error
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "channels"
    - extension == ".tsv"
    - associations.electrodes.name != null
    - columns.electrode_name != null
  checks:
    - |
      length(intersects(unique(columns.electrode_name), associations.electrodes.name))
      + count(unique(columns.electrode_name), "n/a")
      >= length(unique(columns.electrode_name))
