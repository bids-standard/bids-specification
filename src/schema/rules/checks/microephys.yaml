---
# For microephys, only space-labeled electrodes.tsv requires coordsystem.json
# Non-microephys modalities are handled by RequiredCoordsystem in channels.yaml
MicroephysRequiredCoordsystemWithSpace:
  issue:
    code: MICROEPHYS_COORDSYSTEM_REQUIRED
    message: |
      For microelectrode electrophysiology data, if an electrodes.tsv file has a
      space-<label> entity, a corresponding coordsystem.json file with the same
      space label must also be present.
    level: error
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "electrodes"
    - extension == ".tsv"
    - '"space" in entities'
  checks:
    - associations.coordsystem != null

# Stereotaxic coordinates cannot be interpreted without knowing the point they are
# measured from, so requiring the reference point is conditioned on their presence.
MicroephysRequiredAnatomicalReferencePoint:
  issue:
    code: MICROEPHYS_ANATOMICAL_REFERENCE_POINT_REQUIRED
    message: |
      The `anatomical_reference_point` column MUST be defined in `*_probes.tsv` when
      stereotaxic coordinates are given, that is, when any of the `AP`, `ML`, or `DV`
      columns are present.
    level: error
  selectors:
    - intersects([datatype], ["ecephys", "icephys"])
    - suffix == "probes"
    - extension == ".tsv"
    - columns.AP != null || columns.ML != null || columns.DV != null
  checks:
    - columns.anatomical_reference_point != null
