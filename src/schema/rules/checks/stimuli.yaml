---
# The stim_id values in events.tsv are identifiers (stim-<label>), not file
# paths, so their existence in /stimuli cannot be verified with exists().
# Verifying that each stim_id has a matching stimulus file or stimuli.tsv
# entry requires cross-file column access (a stimuli association) and is
# left to future validator support. Value patterns for stim_id and
# stimulus_id are enforced through the column definitions in
# objects/columns.yaml.
StimuliTsvForStimId:
  issue:
    code: STIMULI_TSV_MISSING
    message: |
      The stim_id column is used in an events.tsv file, but no stimuli.tsv
      file is present in the /stimuli directory. The stimuli.tsv file lists
      the stimulus identifiers that stim_id values refer to.
    level: warning
  selectors:
    - suffix == "events"
    - columns.stim_id != null
  checks:
    - exists("stimuli.tsv", "stimuli") == 1

StimuliDirectoryStructure:
  issue:
    code: INVALID_STIMULUS_FILENAME
    message: |
      Stimulus files in the /stimuli directory must follow the BIDS naming convention
      with the format stim-<label>[_part-<label>]_<suffix>.<extension>
    level: warning
  selectors:
    - datatype == "stimuli"
    - suffix in ["audio", "video", "audiovideo", "image"]
  checks:
    - entities.stimulus != null
