---
# BIDS Validator Original Issue Code #74
# Was DUPLICATE_NIFTI_FILES, but applies generally
DuplicateFiles:
  issue:
    code: DUPLICATE_FILES
    message: |
      File exists with and without `.gz` extension.
    level: error
  selectors:
    - match(extension, '\.gz$')
  checks:
    - exists(substr(path, 0, length(path) - 3), "dataset") == 0

ReadmeFileSmall:
  issue:
    code: README_FILE_SMALL
    message: |
      The recommended file '/README' is very small.
      Please consider expanding it with additional information about the dataset.
    level: warning
  selectors:
    - match(path, '^/README')
  checks:
    - size > 150

DuplicateReadmes:
  issue:
    code: MULTIPLE_README_FILES
    message: |
      There are multiple '/README' files (with different extensions) in this BIDS
      dataset. Only one '/README' file should exist.
    level: error
  selectors:
    - match(path, '^/README.*')
  checks:
    - exists(["README", "README.md", "README.rst", "README.txt"], "dataset") == 1

# BIDS Validator Original Issue Code #100
BrainvisionLinksBroken:
  issue:
    code: BRAINVISION_LINKS_BROKEN
    message: |
      A BrainVision recording must include matching '.eeg', '.vhdr', and '.vmrk' files.
    level: error
  selectors:
    # Report once per recording: prefer the header, then the marker, then the data file.
    - |
      extension == ".vhdr" ||
      (extension == ".vmrk" &&
       exists(substr(path, 1, length(path) - length(extension)) + ".vhdr", "dataset") == 0) ||
      (extension == ".eeg" &&
       exists(substr(path, 1, length(path) - length(extension)) + ".vhdr", "dataset") == 0 &&
       exists(substr(path, 1, length(path) - length(extension)) + ".vmrk", "dataset") == 0)
  checks:
    - |
      exists([
        substr(path, 1, length(path) - length(extension)) + ".eeg",
        substr(path, 1, length(path) - length(extension)) + ".vhdr",
        substr(path, 1, length(path) - length(extension)) + ".vmrk"
      ], "dataset") == 3
